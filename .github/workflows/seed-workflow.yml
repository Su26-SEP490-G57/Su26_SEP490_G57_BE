name: Seed Database Workflow (DEV ONLY)

on:
  workflow_dispatch:
    inputs:
      drop_db:
        description: '🔥 HARD RESET: Wipe database schema and re-run migrations from scratch before seeding?'
        required: true
        type: boolean
        default: false

concurrency:
  group: poms-db-maintenance-dev
  cancel-in-progress: false
  queue: max

jobs:
  execute_seed:
    name: Reset and Seed Database
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Execute Seeding Script via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_IMAGE_NAME: ${{ vars.APP_IMAGE_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: APP_IMAGE_NAME,DB_PASSWORD
          script: |
            set -e

            TARGET_DIR="/var/www/poms-api"
            cd $TARGET_DIR

            ENV_NAME="dev"
            COMPOSE_FILE="docker-compose.${ENV_NAME}.yml"
            SERVICE_NAME="app-${ENV_NAME}"

            DROP_DB_REQUESTED="${{ github.event.inputs.drop_db }}"

            echo "🔍 [CI/CD] Verifying infrastructure configuration for environment: $ENV_NAME..."

            if [ ! -f "$COMPOSE_FILE" ]; then
                echo "❌ [CI/CD Error] Configuration file $COMPOSE_FILE not found on VPS!"
                exit 1
            fi

            if [ "$DROP_DB_REQUESTED" = "true" ]; then
                echo "🔥 [CI/CD] [Hard Reset] Initiating complete schema purge for database: poms_${ENV_NAME}..."
                
                # Drop and recreate schema public using the root credentials via postgres container
                sudo docker exec -t poms-postgres psql -U poms_root_admin -d poms_${ENV_NAME} -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT USAGE, CREATE ON SCHEMA public TO poms_dev;"
                
                echo "🚀 [CI/CD] [Migration] Launching transient container to rebuild schema architecture..."
                docker compose -f $COMPOSE_FILE run --pull always --rm $SERVICE_NAME npm run migration:apply
            else
                echo "ℹ️ [CI/CD] Preserving current database schema. Proceeding directly to data population..."
            fi

            echo "🚀 [CI/CD] [Seed] Launching transient container to run seed script..."

            if docker compose -f $COMPOSE_FILE run --pull always --rm $SERVICE_NAME npm run seed; then
                echo "✅ [CI/CD Success] Database has been successfully wiped and re-seeded for environment: $ENV_NAME"
            else
                echo "❌ [CI/CD Failure] Seeding script crashed inside the container!"
                exit 1
            fi
