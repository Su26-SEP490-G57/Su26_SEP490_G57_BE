name: Feature Branch CI/CD Workflow

permissions:
  contents: read
  packages: write
  deployments: write
  actions: write

on:
  push:
    branches:
      - 'SEP490-*'
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'nest-cli.json'
      - 'resources/docker/Dockerfile'
      - 'resources/docker/docker-compose.dev.yml'
      - 'resources/scripts/check-health.sh'
      - '.github/workflows/feature-workflow.yml'
      - '.github/workflows/deploy-workflow.yml'
      - '.github/workflows/code-quality-workflow.yml'
      - '.github/actions/**'

jobs:
  cancel_stale_dev_deploys:
    name: Cancel Pending-Approval Dev Deploys
    runs-on: ubuntu-latest
    steps:
      - name: Cancel dev deploy jobs still waiting on approval from older runs on this branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');

            const { data: runsData } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'feature-workflow.yml',
              branch,
              event: 'push',
              per_page: 50,
            });

            const staleRuns = runsData.workflow_runs.filter(
              (run) => run.id !== context.runId && run.status !== 'completed',
            );

            for (const run of staleRuns) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });

              // Only target jobs still stuck behind manual environment-approval ("waiting").
              // Jobs that are "queued" (runner about to pick them up) or "in_progress"
              // (already deploying) must never be touched here.
              const pendingApprovalJobs = jobsData.jobs.filter(
                (job) => job.name.startsWith('Deploy to Dev') && job.status === 'waiting',
              );

              for (const job of pendingApprovalJobs) {
                console.log(`Cancelling dev deploy job #${job.id} ("${job.name}") still waiting on approval in run #${run.id}`);
                try {
                  await github.rest.actions.cancelWorkflowJob({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: job.id,
                  });
                } catch (error) {
                  console.log(`Failed to cancel job #${job.id}: ${error.message}`);
                }
              }
            }

  code_quality:
    name: Verify Code Quality
    uses: ./.github/workflows/code-quality-workflow.yml
    with:
      lint_migrations: true

  deploy_dev:
    name: Deploy to Dev
    needs: code_quality
    uses: ./.github/workflows/deploy-workflow.yml
    with:
      environment: dev
    secrets: inherit
