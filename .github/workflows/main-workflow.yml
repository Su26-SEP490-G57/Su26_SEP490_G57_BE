name: Main Branch CI/CD Workflow

permissions:
  contents: read
  packages: write
  deployments: write
  actions: write

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'nest-cli.json'
      - 'resources/docker/Dockerfile'
      - 'resources/docker/docker-compose.staging.yml'
      - 'resources/scripts/check-health.sh'
      - '.github/workflows/main-workflow.yml'
      - '.github/workflows/deploy-workflow.yml'
      - '.github/actions/**'

jobs:
  code_quality:
    name: Verify Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Static Check
        run: |
          npm run format:check
          npm run lint

  deploy_staging:
    name: Deploy to Staging
    needs: code_quality
    uses: ./.github/workflows/deploy-workflow.yml
    with:
      environment: staging
    secrets: inherit
