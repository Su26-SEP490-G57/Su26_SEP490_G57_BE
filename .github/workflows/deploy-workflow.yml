name: Deploy Workflow

permissions:
  contents: read
  packages: write
  deployments: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

  workflow_call:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        type: string

jobs:
  auto_approve:
    name: Auto Approve If Manual Trigger
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Auto Approve If Manual Trigger
        uses: activescott/automate-environment-deployment-approval@v1.0.6
        with:
          github_token: ${{ secrets.AUTO_APPROVE_TOKEN }}
          environment_allow_list: |
            dev
          actor_allow_list: |
            WhiteAngel2406
            BinhH12
            fonghtdev
            giangdoit123
            lucif3r2003

  build_and_deploy:
    name: Build & Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    if: |
      inputs.environment == 'dev' || 
      ((inputs.environment == 'staging' || inputs.environment == 'prod') && github.ref_name == 'main')

    concurrency:
      group: poms-api-pipeline-${{ inputs.environment }}-${{ github.sha }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate Short SHA Tag
        id: vars
        run: echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker Image Existence in GHCR
        id: check_manifest
        run: |
          FULL_IMAGE_PATH="ghcr.io/${{ vars.APP_IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}"
          if docker manifest inspect $FULL_IMAGE_PATH > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "🚀 [GHCR Hit] Image with tag ${{ steps.vars.outputs.short_sha }} already exists. Skipping build stage!"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📦 [GHCR Miss] Image not found. Proceeding to build stage..."
          fi

      - name: Build and Push Docker Image
        if: steps.check_manifest.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: resources/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ vars.APP_IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ghcr.io/${{ vars.APP_IMAGE_NAME }}:${{ inputs.environment }}-latest

      - name: Deploy to Environment via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_IMAGE_NAME: ${{ vars.APP_IMAGE_NAME }}
          APP_IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: APP_IMAGE_NAME,APP_IMAGE_TAG,DB_PASSWORD,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,FRONTEND_URL,FIREBASE_SERVICE_ACCOUNT_BASE64
          script: |
            set -e  

            docker network create poms-${{ inputs.environment }} || true

            TARGET_DIR="/var/www/poms-api"
            mkdir -p $TARGET_DIR && cd $TARGET_DIR

            echo "🔑 [CI/CD] Writing Firebase service account file..."
            mkdir -p keys
            echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 -d > keys/firebase-admin.json
            chmod 600 keys/firebase-admin.json

            COMPOSE_FILE="docker-compose.${{ inputs.environment }}.yml"
            RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/resources/docker/$COMPOSE_FILE"
            SERVICE_NAME="app-${{ inputs.environment }}"

            echo "📥 [CI/CD] Downloading docker-compose file..."
            curl -sSL $RAW_URL -o $COMPOSE_FILE

            echo "📥 [CI/CD] Pulling latest NestJS docker image..."
            docker compose -f $COMPOSE_FILE pull $SERVICE_NAME

            if [ "${{ inputs.environment }}" == "dev" ]; then
              echo "🧹 [CI/CD] [Dev] Resetting database schema to avoid cross-branch migration conflicts..."
              docker compose -f $COMPOSE_FILE run --rm $SERVICE_NAME npm run schema:drop

              echo "🗄️ [CI/CD] [Migration] Running database migrations from scratch..."
              docker compose -f $COMPOSE_FILE run --rm $SERVICE_NAME npm run migration:apply

              echo "🌱 [CI/CD] [Dev] Seeding database..."
              docker compose -f $COMPOSE_FILE run --rm $SERVICE_NAME npm run seed
            else
              echo "🗄️ [CI/CD] [Migration] Running database migrations..."
              docker compose -f $COMPOSE_FILE run --rm $SERVICE_NAME npm run migration:apply
            fi

            chmod +x ./resources/scripts/check-health.sh || true

            CONTAINER_NAME="poms-api-${{ inputs.environment }}"
            CANARY_NAME="${CONTAINER_NAME}-canary"

            echo "🕵️ [CI/CD] Starting canary container to validate the new image before touching the live container..."
            docker rm -f $CANARY_NAME > /dev/null 2>&1 || true
            docker compose -f $COMPOSE_FILE run -d --name $CANARY_NAME $SERVICE_NAME

            echo "🔍 Checking canary health..."
            if ./resources/scripts/check-health.sh $CANARY_NAME 25 3; then
              echo "✅ [CI/CD] Canary is healthy. Promoting new image — recreating application container..."
              docker rm -f $CANARY_NAME > /dev/null 2>&1 || true
              docker compose -f $COMPOSE_FILE up -d

              echo "🔍 Checking live container health..."
              ./resources/scripts/check-health.sh $CONTAINER_NAME 25 3
            else
              echo "❌ [CI/CD] Canary failed health check. Aborting deploy — live container was never touched, no rollback needed."
              docker rm -f $CANARY_NAME > /dev/null 2>&1 || true
              exit 1
            fi
