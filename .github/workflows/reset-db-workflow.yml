name: Database Hard Reset Workflow (DEV ONLY)

on:
  workflow_dispatch:

concurrency:
  group: poms-db-maintenance-dev
  cancel-in-progress: false
  queue: max

jobs:
  reset_db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (To get latest migration files)
        uses: actions/checkout@v4

      - name: Execute Reset via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            DB_NAME="poms_dev"
            DB_USER="poms_root_admin"
            CONTAINER_NAME="poms-postgres"
            APP_CONTAINER="poms-backend-dev"

            echo "🔥 [CI/CD] Wiping entire database schema for $DB_NAME..."
            sudo docker exec -t $CONTAINER_NAME psql -U $DB_USER -d $DB_NAME -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT USAGE, CREATE ON SCHEMA public TO poms_dev;"

            echo "🚀 [CI/CD] Running migrations from scratch..."
            sudo docker exec -t $APP_CONTAINER npm run migration:apply

            echo "✅ [CI/CD Success] Database $DB_NAME has been reset to a completely clean state!"
