name: 'Setup NestJS Environment with Cache'
description: 'Initializes Node.js, configures smart npm caching, installs dependencies, and generates dynamic environment files.'

inputs:
  environment:
    description: 'The environment to be used (e.g., dev, staging, prod)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'package.json'
        cache: 'npm'

    - name: Cache Node Modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ${{ github.workspace }}/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles(format('{0}/package-lock.json', github.workspace)) }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      shell: bash
      run: npm ci
