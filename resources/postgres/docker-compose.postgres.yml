services:
  postgres:
    image: postgres:16-alpine
    container_name: poms-postgres
    environment:
      POSTGRES_USER: poms_root_admin
      POSTGRES_PASSWORD: ${SUPER_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - poms-dev
      - poms-staging
      - poms-prod
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  poms-dev:
    external: true
  poms-staging:
    external: true
  poms-prod:
    external: true

volumes:
  postgres_data:
