services:
  app-dev:
    image: ${APP_IMAGE_NAME}:${APP_IMAGE_TAG:-dev-latest}
    container_name: poms-api-dev
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: poms_dev
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: poms_dev
      DB_RETRY_ATTEMPTS: 1
      DB_RETRY_DELAY: 1000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL}
      MIN_SUPPORTED_VERSION_CODE: ${MIN_SUPPORTED_VERSION_CODE:-1}
      FIREBASE_SERVICE_ACCOUNT: /app/keys/firebase-admin.json
    volumes:
      - ./keys/firebase-admin.json:/app/keys/firebase-admin.json:ro
    networks:
      - poms-dev
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  poms-dev:
    external: true
