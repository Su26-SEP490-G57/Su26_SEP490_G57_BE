services:
  app-dev:
    image: ${APP_IMAGE_NAME}:${APP_IMAGE_TAG:-dev-latest}
    container_name: poms-api-dev
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: poms_dev
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: poms_dev
      DB_RETRY_ATTEMPTS: 1
      DB_RETRY_DELAY: 1000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
    networks:
      - poms-dev
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  poms-dev:
    external: true
