services:
  nginx-gateway:
    image: nginx:stable-alpine3.23-perl
    container_name: nginx-gateway
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./templates:/etc/nginx/templates:ro
    environment:
      - NGINX_ENVSUBST_FILTER=DOMAIN_NAME
    networks:
      - poms-dev
      - poms-staging
      - poms-prod

networks:
  poms-dev:
    external: true
  poms-staging:
    external: true
  poms-prod:
    external: true
