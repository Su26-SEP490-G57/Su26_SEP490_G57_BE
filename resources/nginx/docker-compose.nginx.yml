services:
  nginx-gateway:
    image: nginx:stable-alpine3.23-perl
    container_name: poms-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./templates:/etc/nginx/templates:ro
    environment:
      - NGINX_ENVSUBST_FILTER=DOMAIN_NAME
    networks:
      - poms-dev
      - poms-staging
      - poms-prod
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:80/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  poms-dev:
    external: true
  poms-staging:
    external: true
  poms-prod:
    external: true
